name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validation:
    if: github.repository == 'dastagirS/docket'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Validate stable release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch) release_tag=$REQUESTED_TAG ;;
            push)
              if [[ "$REF_TYPE" != tag ]]; then
                echo 'Release push must reference a tag.' >&2
                exit 1
              fi
              release_tag=$REF_NAME ;;
            *) echo 'Unsupported release event.' >&2; exit 1 ;;
          esac
          tag_bytes_max=64
          if [[ ${#release_tag} -gt $tag_bytes_max || ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must be stable vMAJOR.MINOR.PATCH versions.' >&2
            exit 1
          fi
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          persist-credentials: false
      - name: Require successful push validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ steps.checkout.outputs.commit }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          class RefuseRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file, code, message, headers, target):
                  raise RuntimeError('Validation lookup refused a redirect')

          def read_metadata(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repository + path, headers=headers)
              with opener.open(request, timeout=request_timeout_seconds) as response:
                  payload = response.read(response_bytes_max + 1)
              if len(payload) > response_bytes_max:
                  raise ValueError('Validation lookup exceeded its response limit')
              return json.loads(payload)

          try:
              repository = os.environ['GH_REPO']
              commit = os.environ['SOURCE_COMMIT']
              if repository != 'dastagirS/docket' or not re.fullmatch(r'[0-9a-f]{40}', commit):
                  raise ValueError('Invalid validation lookup identity')
              query = urllib.parse.urlencode({'head_sha': commit, 'event': 'push', 'per_page': 1, 'exclude_pull_requests': 'true'})
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
              opener = urllib.request.build_opener(RefuseRedirect())
              response_bytes_max = 1024 * 1024
              request_timeout_seconds = 15
              result = read_metadata('/actions/workflows/validation.yml/runs?' + query)
              runs = result['workflow_runs']
              if type(result['total_count']) is not int or result['total_count'] < 1 or not isinstance(runs, list) or len(runs) != 1:
                  raise ValueError('No unambiguous push validation found for the release commit')
              run = runs[0]
              if run['head_sha'] != commit or run['path'] != '.github/workflows/validation.yml' or run['event'] != 'push' or run['head_repository']['full_name'] != repository:
                  raise ValueError('Validation identity does not match the release commit')
              if run['status'] != 'completed' or run['conclusion'] != 'success':
                  raise ValueError('Latest push validation has not completed successfully')
              if type(run['id']) is not int or run['id'] <= 0 or type(run['run_attempt']) is not int or run['run_attempt'] <= 0:
                  raise ValueError('Validation run identity is invalid')
              jobs_per_page = 100
              result = read_metadata(f'/actions/runs/{run["id"]}/attempts/{run["run_attempt"]}/jobs?per_page={jobs_per_page}')
              jobs = result['jobs']
              if not isinstance(jobs, list) or len(jobs) > jobs_per_page or result['total_count'] != len(jobs):
                  raise ValueError('Validation job lookup is incomplete')
              required = {
                  'docket-linux-amd64': {'Go tests, race detection, vet, and frontend type checks', 'Build and verify Linux validation executable', 'Real CLI and embedded-skill checks'},
                  'docket-darwin-arm64': {'Native Apple Silicon Go checks', 'Native macOS vulnerability checks', 'Real CLI and embedded-skill checks'},
              }
              verified = set()
              for job in jobs:
                  name = job['name'].rsplit(' / ', 1)[-1]
                  if name not in required:
                      continue
                  if name in verified or job['status'] != 'completed' or job['conclusion'] != 'success' or job['head_sha'] != commit or job['run_attempt'] != run['run_attempt']:
                      raise ValueError('A native validation job did not pass for the release commit')
                  passed = {step['name'] for step in job['steps'] if step['status'] == 'completed' and step['conclusion'] == 'success'}
                  if not required[name].issubset(passed):
                      raise ValueError('Required validation checks were skipped or failed')
                  verified.add(name)
              if verified != set(required):
                  raise ValueError('Both native validation jobs must have passed')
              print('Release commit has successful push validation; tests will not be rerun.')
          except Exception as error:
              if isinstance(error, urllib.error.HTTPError):
                  error.close()
              print('Release blocked: ' + str(error) + '. Push the commit and wait for Validation to pass before releasing; no retries or polling were attempted.', file=sys.stderr)
              sys.exit(1)
          PYTHON

  build:
    needs: validation
    uses: ./.github/workflows/checks.yml
    with:
      tag: ${{ needs.validation.outputs.tag }}
      commit: ${{ needs.validation.outputs.commit }}
      upload_release_assets: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-docket-*
          path: release-assets
          merge-multiple: false
      - name: Verify artifacts and publish through a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          class RefuseRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file, code, message, headers, target):
                  raise RuntimeError('Refusing to forward release credentials through a redirect')

          opener = urllib.request.build_opener(RefuseRedirect())
          response_bytes_max = 1024 * 1024
          release_assets_max = 1000
          releases_per_page = 100
          release_pages_max = 10
          tag_bytes_max = 64
          request_timeout_seconds = 30

          # Only fixed GitHub API hosts receive the job token; artifact contents are never executed.
          def request(method, path, payload=None, upload=False):
              origin = 'https://uploads.github.com' if upload else 'https://api.github.com'
              headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'User-Agent': 'docket-release', 'X-GitHub-Api-Version': '2022-11-28'}
              if isinstance(payload, dict):
                  payload = json.dumps(payload).encode()
                  headers['Content-Type'] = 'application/json'
              elif payload is not None:
                  headers['Content-Type'] = 'application/octet-stream'
              outgoing = urllib.request.Request(origin + '/repos/' + repository + path, data=payload, headers=headers, method=method)
              with opener.open(outgoing, timeout=request_timeout_seconds) as response:
                  body = response.read(response_bytes_max + 1)
              if len(body) > response_bytes_max:
                  raise RuntimeError('GitHub API response exceeded the release metadata limit')
              return json.loads(body)

          def read_artifact(name, bytes_max):
              path = pathlib.Path(name)
              if path.is_symlink() or not path.is_file() or not 0 < path.stat().st_size <= bytes_max:
                  raise ValueError('Missing, invalid, or oversized release file: ' + name)
              with path.open('rb') as file:
                  payload = file.read(bytes_max + 1)
              if not 0 < len(payload) <= bytes_max:
                  raise ValueError('Release file changed size beyond its limits: ' + name)
              return payload, hashlib.sha256(payload).hexdigest()

          def check_tag():
              reference = urllib.parse.quote('refs/tags/' + tag, safe='')
              if request('GET', '/commits/' + reference)['sha'] != source_commit:
                  raise RuntimeError('Release tag moved; refusing to publish mismatched assets')

          def check_asset(asset, name):
              payload, digest = artifacts[name]
              if asset.get('size') != len(payload) or asset.get('state') != 'uploaded' or asset.get('digest') != 'sha256:' + digest:
                  raise RuntimeError('Conflicting or incomplete release asset: ' + name + '; no existing assets were overwritten')

          try:
              repository = os.environ['GH_REPO']
              tag = os.environ['RELEASE_TAG']
              source_commit = os.environ['SOURCE_COMMIT']
              token = os.environ['GH_TOKEN']
              if len(tag) > tag_bytes_max or not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
                  raise ValueError('Release tag must be a stable vMAJOR.MINOR.PATCH version')
              artifacts = {}
              manifest_rows = []
              for name in ('docket-linux-amd64', 'docket-darwin-arm64'):
                  prefix = 'release-' + name + '/'
                  commit = read_artifact(prefix + 'SOURCE_COMMIT', 128)[0]
                  if commit != (source_commit + '\n').encode():
                      raise ValueError('Platform artifacts were built from different commits')
                  artifacts[name] = read_artifact(prefix + name, 64 * 1024 * 1024)
                  row = artifacts[name][1] + '  ' + name + '\n'
                  if read_artifact(prefix + 'SHA256SUMS', 16 * 1024)[0] != row.encode():
                      raise ValueError('Platform checksum does not match its executable')
                  manifest_rows.append(row)
              manifest = ''.join(manifest_rows).encode()
              artifacts['SHA256SUMS'] = (manifest, hashlib.sha256(manifest).hexdigest())
              check_tag()
              try:
                  release = request('GET', '/releases/tags/' + tag)
              except urllib.error.HTTPError as error:
                  status = error.code
                  error.close()
                  if status != 404:
                      raise RuntimeError('Cannot inspect the existing release (HTTP ' + str(status) + ')')
                  # Tag lookup only finds published releases; list authenticated drafts before creating another.
                  matching_releases = {}
                  for page in range(1, release_pages_max + 1):
                      releases = request('GET', f'/releases?per_page={releases_per_page}&page={page}')
                      if not isinstance(releases, list) or len(releases) > releases_per_page:
                          raise ValueError('GitHub returned an unexpected release listing')
                      for candidate in releases:
                          if candidate['tag_name'] == tag:
                              matching_releases[candidate['id']] = candidate
                              if len(matching_releases) > 1:
                                  raise RuntimeError('Multiple releases match this tag; inspect drafts before rerunning')
                      if len(releases) < releases_per_page:
                          break
                      if page == release_pages_max:
                          raise RuntimeError('Release lookup limit reached; cannot safely rule out an existing draft')
                  if matching_releases:
                      release = next(iter(matching_releases.values()))
                  else:
                      release = request('POST', '/releases', {'tag_name': tag, 'target_commitish': source_commit, 'name': 'Docket ' + tag, 'generate_release_notes': True, 'draft': True})
              release_identifier = release['id']
              if type(release_identifier) is not int or release_identifier <= 0 or release['tag_name'] != tag:
                  raise ValueError('GitHub returned an unexpected release identity')
              if len(release['assets']) > release_assets_max:
                  raise ValueError('Release asset count exceeded its limit')
              existing_names = set()
              for asset in release['assets']:
                  name = asset['name']
                  if name in artifacts:
                      if name in existing_names:
                          raise ValueError('Duplicate release asset: ' + name)
                      check_asset(asset, name)
                      existing_names.add(name)
              for name in artifacts:
                  if name not in existing_names:
                      uploaded = request('POST', f'/releases/{release_identifier}/assets?name=' + urllib.parse.quote(name, safe=''), artifacts[name][0], upload=True)
                      if uploaded.get('name') != name:
                          raise ValueError('GitHub returned an unexpected uploaded asset name')
                      check_asset(uploaded, name)
              check_tag()
              if release['draft']:
                  request('PATCH', f'/releases/{release_identifier}', {'draft': False})
              current = request('GET', '/releases/tags/' + tag)
              if current['id'] != release_identifier or current['tag_name'] != tag or current['draft']:
                  raise RuntimeError('The tag does not resolve to the release that received the verified assets')
              if len(current['assets']) > release_assets_max:
                  raise ValueError('Published asset count exceeded its limit')
              for name in artifacts:
                  matching = [asset for asset in current['assets'] if asset['name'] == name]
                  if len(matching) != 1:
                      raise RuntimeError('Published release is missing a unique asset: ' + name)
                  check_asset(matching[0], name)
              print('Verified published release ' + tag + ': docket-linux-amd64, docket-darwin-arm64, SHA256SUMS')
          except Exception as error:
              if isinstance(error, urllib.error.HTTPError):
                  error.close()
              print('Release publication failed: ' + str(error) + '. Inspect the release before manually rerunning; no automatic write retries were attempted.', file=sys.stderr)
              sys.exit(1)
          PYTHON
