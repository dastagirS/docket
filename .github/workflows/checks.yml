name: Build and check

'on':
  workflow_call:
    inputs:
      tag:
        description: 'Validated release tag; empty for push validation.'
        type: string
        default: ''
      commit:
        description: 'Commit approved by the release validation gate; empty for branch pushes.'
        type: string
        default: ''
      upload_release_assets:
        description: 'Build/package a previously validated release without rerunning checks.'
        type: boolean
        default: false
    outputs:
      tag:
        value: ${{ jobs.build.outputs.tag }}
      commit:
        value: ${{ jobs.build.outputs.commit }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: docket-linux-amd64
          - runner: macos-15
            asset: docket-darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      tag: ${{ inputs.tag || 'dev' }}
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: runner.os == 'macOS'
        with:
          go-version-file: go.mod
          architecture: arm64
      - name: Build Apple Silicon frontend
        if: runner.os == 'macOS'
        env:
          RUN_CHECKS: ${{ !inputs.upload_release_assets }}
        run: |
          test "$(uname -s)/$(uname -m)" = Darwin/arm64
          npm --prefix frontend ci --no-audit --no-fund
          if [ "$RUN_CHECKS" = true ]; then
            npm --prefix frontend run build
          else
            npm --prefix frontend run build:assets
          fi
      - name: Native Apple Silicon Go checks
        if: runner.os == 'macOS' && !inputs.upload_release_assets
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
          GOTOOLCHAIN: local
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          go test -race -count=1 -timeout=120s ./...
          go vet ./...
      - name: Build and ad-hoc sign Apple Silicon executable
        if: runner.os == 'macOS'
        env:
          BUILD_VERSION: ${{ inputs.tag || 'dev' }}
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
          GOTOOLCHAIN: local
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          mkdir "$RUNNER_TEMP/docket-build"
          go build -trimpath -tags 'netgo osusergo sqlite_omit_load_extension' -ldflags "-s -w -X main.buildVersion=$BUILD_VERSION" -o "$RUNNER_TEMP/docket-build/docket" ./cmd/docket
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/docket-build/docket"
          codesign --verify --strict "$RUNNER_TEMP/docket-build/docket"
      - name: Native macOS vulnerability checks
        if: runner.os == 'macOS' && !inputs.upload_release_assets
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -scan=package -test -tags 'netgo,osusergo,sqlite_omit_load_extension' ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$RUNNER_TEMP/docket-build/docket"
      - name: Go tests, race detection, vet, and frontend type checks
        if: runner.os == 'Linux' && !inputs.upload_release_assets
        run: make test
      - name: Build and verify Linux validation executable
        if: runner.os == 'Linux' && !inputs.upload_release_assets
        env:
          BUILD_VERSION: ${{ inputs.tag || 'dev' }}
        run: make --jobs=1 build security verify-portable BUILD_DIRECTORY="$RUNNER_TEMP/docket-build"
      - name: Build previously validated Linux release
        if: runner.os == 'Linux' && inputs.upload_release_assets
        env:
          BUILD_VERSION: ${{ inputs.tag }}
        run: make build FRONTEND_CHECK=false BUILD_DIRECTORY="$RUNNER_TEMP/docket-build"
      - name: Real CLI and embedded-skill checks
        if: ${{ !inputs.upload_release_assets }}
        env:
          DOCKET_BINARY: ${{ runner.temp }}/docket-build/docket
          DOCKET_EXPECTED_BUILD_VERSION: ${{ inputs.tag || 'dev' }}
        run: node --test tests/cli.test.mjs tests/skill.test.mjs tests/install.test.mjs tests/workflow.test.mjs tests/release.test.mjs
      - name: Package release assets
        if: inputs.upload_release_assets
        env:
          RELEASE_TAG: ${{ inputs.tag || 'dev' }}
        run: |
          sh scripts/package-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/docket-build/docket" "$RUNNER_TEMP/docket-release"
          printf '%s\n' '${{ steps.checkout.outputs.commit }}' > "$RUNNER_TEMP/docket-release/SOURCE_COMMIT"
      - if: inputs.upload_release_assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.asset }}
          path: ${{ runner.temp }}/docket-release/*
          if-no-files-found: error
          retention-days: 7
